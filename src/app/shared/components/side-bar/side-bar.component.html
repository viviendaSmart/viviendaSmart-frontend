<nav class="side-bar">
  <div class="header-bar">
    <div class="header-title">
      <img class="logo" src="/assets/img/logo.png">
      <p>{{ 'SIDE_BAR_VIVIENDASMART' | translate }}</p>
    </div>
    <hr>
  </div>
  <ul class="options">
    @for (option of options; track option.class) {
    <li class="option">
      <button [routerLink]="option.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <img [src]="option.src" alt="">
        <p>{{ option.class | translate }}</p>
      </button>
    </li>
    }
  </ul>
  <div class="footer-bar">
    <li class="option">
      <button (click)="toggleTheme()">
        <img [src]="isDarkMode ? '/assets/img/sol.svg' : '/assets/img/luna.svg'" alt="Toggle Theme">
        <p>{{ (isDarkMode ? 'SIDEBAR.LIGHT_MODE' : 'SIDEBAR.DARK_MODE') | translate }}</p>
      </button>
    </li>
    <hr>
    <li class="logout">
      <button (click)="onLeave()" routerLinkActive="active">
        <img src="/assets/img/salida.svg">
        <p>{{ 'SIDE_BAR_CERRAR_SESI_N' | translate }}</p>
      </button>
    </li>
  </div>
</nav>
