<div class="container">
  <div class="selection-card" [formGroup]="form">
    <div class="selection-card-header">
      <span class="selection-card-title">SELECCIÓN DE DATOS</span>
    </div>

    <div class="selection-card-row">
      <!-- Vivienda seleccionada -->
      <label class="field">
        <span class="field-label">Inmueble seleccionado 🏠</span>
        <select class="field-input" formControlName="address"
          [class.is-invalid]="form.get('address')?.invalid && form.get('address')?.touched">
          <option [ngValue]="null">-- Selecciona una vivienda --</option>
          <option *ngFor="let v of viviendas" [ngValue]="v.address">
            {{ v.address }}
          </option>
        </select>
        <div class="error-message" *ngIf="form.get('address')?.invalid && form.get('address')?.touched">
          <small>Seleccione una propiedad.</small>
        </div>
      </label>

      <!-- Cliente seleccionado -->
      <label class="field">
        <span class="field-label">Cliente seleccionado 👤</span>
        <select class="field-input" formControlName="dni"
          [class.is-invalid]="form.get('dni')?.invalid && form.get('dni')?.touched">
          <option [ngValue]="null">-- Selecciona un cliente --</option>
          <option *ngFor="let c of clientes" [ngValue]="c.dni">
            {{ c.dni }}
          </option>
        </select>
        <div class="error-message" *ngIf="form.get('dni')?.invalid && form.get('dni')?.touched">
          <small>Seleccione un cliente.</small>
        </div>
      </label>
    </div>
  </div>
</div>
