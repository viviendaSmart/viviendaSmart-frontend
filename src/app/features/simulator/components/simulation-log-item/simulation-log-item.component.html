<div class="accordion-item" [attr.data-open]="isOpen">
  <div class="accordion-header" (click)="toggle()">
    <div class="header-info">
      <div class="info-group">
        <span class="info-label">Fecha de Creación:</span>
        <span class="info-value">{{ simulation.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
      </div>
      <div class="info-group">
        <span class="info-label">DNI Cliente:</span>
        <span class="info-value">{{ simulation.clientDni }}</span>
      </div>
      <div class="info-group">
        <span class="info-label">Dirección Inmueble:</span>
        <span class="info-value">{{ simulation.propertyAddress }}</span>
      </div>
    </div>
    <div class="header-icon">
      <span *ngIf="!isOpen">▼</span>
      <span *ngIf="isOpen">▲</span>
    </div>
  </div>
  <div class="accordion-body" *ngIf="isOpen">
    <!-- Reutilizamos el modal de respuesta que tiene la tabla y detalles -->
    <app-response-form-modal [simulationResult]="simulation"></app-response-form-modal>
  </div>
</div>
