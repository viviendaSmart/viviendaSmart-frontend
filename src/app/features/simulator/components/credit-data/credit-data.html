<div class="container">
  <div class="loan-card" [formGroup]="form">
    <div class="loan-card-header">
      <span class="loan-card-title">{{ 'CREDIT_DATA_DATOS_DEL_CR_DITO' | translate }}</span>
    </div>

    <div class="loan-card-grid">
      <!-- Precio Vivienda -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_PRECIO_VIVIENDA_S' | translate }}</span>
        <input type="text" class="field-input" formControlName="price" readonly />
      </label>

      <!-- Bono -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_BONO_BFH' | translate }}</span>
        <select class="field-input" formControlName="bono" [class.is-invalid]="form.get('bono')?.invalid && form.get('bono')?.touched">
          <option
            *ngFor="let b of bonos"
            [ngValue]="b.value"
            [disabled]="!availableBonos.has(b.value)">
            {{ b.label }}
          </option>
        </select>
        <div class="error-message" *ngIf="form.get('bono')?.invalid && form.get('bono')?.touched">
          <small>{{ 'CREDIT_DATA_SELECCIONE_UNA_OPCI' | translate }}</small>
        </div>
      </label>

      <!-- Tipo de Tasa -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_TIPO_DE_TASA' | translate }}</span>
        <input class="field-input" formControlName="rateType" readonly>
      </label>

      <!-- Tasa Anual -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_TASA' | translate }}</span>
        <input type="text" class="field-input" formControlName="rate" readonly />
      </label>

      <!-- N° Años -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_N_MERO_DE_A_OS' | translate }}</span>
        <input type="text" class="field-input" formControlName="plazo" minlength="1" maxlength="2" (beforeinput)="validarSoloNumeros($event)"
          [class.is-invalid]="form.get('plazo')?.invalid && form.get('plazo')?.touched" />
        <div class="error-message" *ngIf="form.get('plazo')?.invalid && form.get('plazo')?.touched">
          <small>{{ 'CREDIT_DATA_EL_PLAZO_DEL_PR_STAM' | translate }}</small>
        </div>
      </label>

      <!-- Frecuencia de pago -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_FRECUENCIA_DE_PAGO' | translate }}</span>
        <input type="text" class="field-input" formControlName="frequency" minlength="1" maxlength="3" (beforeinput)="validarSoloNumeros($event)"
          [class.is-invalid]="form.get('frequency')?.invalid && form.get('frequency')?.touched" />
        <div class="error-message" *ngIf="form.get('frequency')?.invalid && form.get('frequency')?.touched">
          <small>{{ 'CREDIT_DATA_LA_FRECUENCIA_DE_PAG' | translate }}</small>
        </div>
      </label>

      <!-- Tipo de Gracia -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_TIPO_DE_GRACIA' | translate }}</span>
        <input class="field-input" formControlName="termtype" readonly>
      </label>

      <!-- Días de Gracia -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_D_AS_DE_GRACIA' | translate }}</span>
        <input type="text" class="field-input" formControlName="term" readonly />
      </label>

      <!-- Moneda -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_MONEDA' | translate }}</span>
        <input class="field-input" formControlName="exchange" readonly>
      </label>

      <!-- Tipo de Tasa COK -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_TIPO_DE_TASA_COK' | translate }}</span>
        <select class="field-input" formControlName="cokRateType" [class.is-invalid]="form.get('cokRateType')?.invalid && form.get('cokRateType')?.touched">
          <option [ngValue]="null" disabled selected>{{ 'CREDIT_DATA_SELECCIONE_TIPO_DE_T' | translate }}</option>
          <option value="TEA">{{ 'CREDIT_DATA_TEA' | translate }}</option>
          <option value="TES">{{ 'CREDIT_DATA_TES' | translate }}</option>
          <option value="TET">{{ 'CREDIT_DATA_TET' | translate }}</option>
          <option value="TEB">{{ 'CREDIT_DATA_TEB' | translate }}</option>
          <option value="TEM">{{ 'CREDIT_DATA_TEM' | translate }}</option>
        </select>
        <div class="error-message" *ngIf="form.get('cokRateType')?.invalid && form.get('cokRateType')?.touched">
          <small>{{ 'CREDIT_DATA_SELECCIONE_EL_TIPO_D' | translate }}</small>
        </div>
      </label>

      <!-- Tasa COK -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_TASA_COK' | translate }}</span>
        <input type="text" class="field-input" formControlName="cokRate" maxlength="10" (beforeinput)="validarSoloNumeros($event)"
          [class.is-invalid]="form.get('cokRate')?.invalid && form.get('cokRate')?.touched" />
        <div class="error-message" *ngIf="form.get('cokRate')?.invalid && form.get('cokRate')?.touched">
          <small *ngIf="form.get('cokRate')?.errors?.['required']">{{ 'CREDIT_DATA_LA_TASA_COK_ES_OBLIG' | translate }}</small>
          <small *ngIf="form.get('cokRate')?.errors?.['min']">{{ 'CREDIT_DATA_DEBE_SER_MAYOR_O_IGU' | translate }}</small>
        </div>
      </label>

    </div>

    <div class="loan-card-header">
      <span class="loan-card-title">{{ 'CREDIT_DATA_COSTOS_INICIALES' | translate }}</span>
    </div>

    <div class="loan-card-grid-2">
      <!-- Cuota Inicial -->
      <label class="field">
        <span class="field-label">{{ 'CREDIT_DATA_CUOTA_INICIAL' | translate }}</span>
        <input type="text" class="field-input" formControlName="initialPayment" maxlength="10" (beforeinput)="validarSoloNumeros($event)"
          [class.is-invalid]="form.get('initialPayment')?.invalid && form.get('initialPayment')?.touched" />
        <div class="error-message" *ngIf="form.get('initialPayment')?.invalid && form.get('initialPayment')?.touched">
          <small>{{ 'CREDIT_DATA_EL_PORCENTAJE_DE_CUO' | translate }}</small>
        </div>
      </label>
      <ng-container formArrayName="initialCosts">
        <label class="field" *ngFor="let ctrl of initialCostsArray.controls; let i = index">
          <span class="field-label">
            {{ initialCostDefinitions[i].label }}
          </span>
          <input type="text" class="field-input" [formControlName]="i" maxlength="10" (beforeinput)="validarSoloNumeros($event)"
                 [class.is-invalid]="ctrl.invalid && ctrl.touched" />
          <div class="error-message" *ngIf="ctrl.invalid && ctrl.touched">
            <small>{{ 'CREDIT_DATA_M_NIMO_0' | translate }}</small>
          </div>
        </label>
      </ng-container>
    </div>


    <div class="loan-card-header">
      <span class="loan-card-title">{{ 'CREDIT_DATA_COSTOS_PERIODICOS' | translate }}</span>
    </div>

    <div class="loan-card-grid-2">
      <ng-container formArrayName="periodicCosts">
        <label class="field" *ngFor="let ctrl of periodicCostsArray.controls; let i = index">
          <span class="field-label">
            {{ periodicCostDefinitions[i].label }}
          </span>
          <input type="text" class="field-input" [formControlName]="i" maxlength="10" (beforeinput)="validarSoloNumeros($event)"
                 [class.is-invalid]="ctrl.invalid && ctrl.touched" />
          <div class="error-message" *ngIf="ctrl.invalid && ctrl.touched">
            <small>{{ 'CREDIT_DATA_M_NIMO_0' | translate }}</small>
          </div>
        </label>
      </ng-container>
    </div>

    <app-classic-button type="button" (click)="onSimulate()" [disabled]="form.invalid">
      {{ 'CREDIT_DATA_SIMULAR_CR_DITO' | translate }}
    </app-classic-button>

    <app-classic-button type="button" class="clean-button" (click)="cleanSimulate()">
      {{ 'CREDIT_DATA_LIMPIAR_SIMULACION' | translate }}
    </app-classic-button>


  </div>
</div>
